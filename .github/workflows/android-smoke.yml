name: Android Appium Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install project dependencies
        run: npm ci

      - name: Install Android driver if needed
        run: |
          if ! npm ls appium-uiautomator2-driver --depth=0 >/dev/null 2>&1; then
            npx appium driver install uiautomator2
          fi

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Settings smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            npx appium --address 127.0.0.1 > appium.log 2>&1 &
            curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:4723/status
            npx tsx settings.test.ts && echo "PASS: Android Settings opened." >> "$GITHUB_STEP_SUMMARY"